<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub stats placeholder</title>
  <desc id="desc">Placeholder card generated before the GitHub Action creates the real stats card.</desc>
  <rect width="495" height="195" rx="6" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="494" height="194" rx="5.5" stroke="#30363D"/>
  <text x="24" y="58" fill="#C9A24E" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">GitHub Stats</text>
  <text x="24" y="98" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="15">This card will be generated by GitHub Actions.</text>
  <text x="24" y="128" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="14">Run the "Update README cards" workflow once after pushing.</text>
</svg>
