<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Terminal style welcome banner</title>
  <desc id="desc">A decorative developer banner styled like a terminal window printing a green welcome message.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07110D"/>
      <stop offset="0.48" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111608"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(356 180) rotate(20) scale(520 240)">
      <stop stop-color="#35F06A" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#35F06A" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#35F06A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 90) rotate(140) scale(440 220)">
      <stop stop-color="#39D7FF" stop-opacity="0.14"/>
      <stop offset="0.58" stop-color="#39D7FF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#39D7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terminal" x1="118" y1="48" x2="1082" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101820"/>
      <stop offset="1" stop-color="#05080B"/>
    </linearGradient>
    <filter id="terminalShadow" x="70" y="4" width="1060" height="344" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="textGlow" x="120" y="112" width="600" height="86" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#35F06A" flood-opacity="0.42"/>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" fill-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#pageBg)"/>
  <rect width="1200" height="360" fill="url(#greenGlow)"/>
  <rect width="1200" height="360" fill="url(#cyanGlow)"/>

  <g opacity="0.18" stroke="#35F06A" stroke-width="1">
    <path d="M64 306H206L254 258H400"/>
    <path d="M796 76H930L978 124H1136"/>
    <path d="M78 74H226"/>
    <path d="M980 294H1130"/>
    <circle cx="254" cy="258" r="4" fill="#35F06A"/>
    <circle cx="978" cy="124" r="4" fill="#39D7FF"/>
  </g>

  <g filter="url(#terminalShadow)">
    <rect x="118" y="48" width="964" height="264" rx="18" fill="url(#terminal)" stroke="#26313A"/>
    <rect x="119" y="49" width="962" height="42" rx="17" fill="#151D24"/>
    <path d="M119 91H1081" stroke="#26313A"/>
  </g>

  <circle cx="148" cy="70" r="6" fill="#FF5F56"/>
  <circle cx="170" cy="70" r="6" fill="#FFBD2E"/>
  <circle cx="192" cy="70" r="6" fill="#27C93F"/>

  <g opacity="0.55" font-family="Consolas, Menlo, Monaco, 'Courier New', monospace" font-size="14">
    <text x="230" y="75" fill="#8B949E">~/profile</text>
    <text x="946" y="75" fill="#4D5B66">bootstrap.sh</text>
  </g>

  <rect x="118" y="92" width="964" height="220" fill="url(#scanlines)" opacity="0.75"/>

  <g font-family="Consolas, Menlo, Monaco, 'Courier New', monospace">
    <g filter="url(#textGlow)">
      <text x="158" y="174" fill="#35F06A" font-size="46" font-weight="700">Welcome, developer.</text>
    </g>

    <text x="158" y="228" fill="#39D7FF" font-size="20">james@github</text>
    <text x="292" y="228" fill="#8B949E" font-size="20">:</text>
    <text x="306" y="228" fill="#F6C177" font-size="20">~/backend-lab</text>
    <text x="464" y="228" fill="#8B949E" font-size="20">$</text>
    <text x="492" y="228" fill="#C9D1D9" font-size="20">./scripts/bootstrap.sh</text>

    <text x="158" y="266" fill="#6EE787" font-size="18">status:</text>
    <text x="238" y="266" fill="#C9D1D9" font-size="18">learning, building, iterating</text>
    <rect x="558" y="250" width="11" height="22" rx="2" fill="#35F06A">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.35s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
